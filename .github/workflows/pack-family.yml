name: pack-family
on:
  push:
    branches: [master]
    paths: ['.github/workflows/pack-family.yml']
  workflow_dispatch:
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.5-rc.2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Root build (generates apps/cli lib)
        run: pnpm build || true
      - name: Per-package build (tolerant, for stragglers)
        run: pnpm -r build || true
      - name: Verify cli lib exists
        run: |
          ls apps/cli/lib/ | head -5
          [ -f apps/cli/lib/bin.js ] && echo "CLI-LIB-OK" || echo "CLI-LIB-MISSING"
      - name: Pack all workspace packages
        run: |
          mkdir -p out
          find . -name package.json -not -path '*/node_modules/*' -not -path './package.json' | while read pj; do
            d=$(dirname "$pj")
            name=$(node -p "require('./$pj').name || ''")
            [ -z "$name" ] && continue
            (cd "$d" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/out" 2>/dev/null) || (cd "$d" && npm pack --pack-destination "$GITHUB_WORKSPACE/out" --silent) || echo "PACK-FAIL $name"
          done
          ls out | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: family-tarballs
          path: out/*.tgz
